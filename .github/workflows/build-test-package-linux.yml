name: Build, test and package on Linux (MinGW)

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-test-package-linux:
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:base-devel

    steps:
    - name: Install packages
      run: pacman -Syu --needed --noconfirm git clang mingw-w64-gcc meson ninja wine

    - name: Prepare LLVM MinGW
      env:
        LLVM_MINGW_VERSION: 20261104
        LLVM_MINGW_DIGEST: sha256:919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
      run: |
        curl -sfLO https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz
        echo "${LLVM_MINGW_DIGEST#sha256:} llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" | sha256sum --check
        mkdir -p "$RUNNER_TEMP/llvm-mingw"
        tar -C "$RUNNER_TEMP/llvm-mingw" -xf llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz --strip-components=1

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set git directory permissions
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Print build version
      run: git describe --always --tags --dirty=+

    - name: Set version (none-tag)
      if: github.ref_type != 'tag'
      run: |
        export VERSION="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Set version (tag)
      if: github.ref_type == 'tag'
      run: |
        export VERSION=$(git describe --always --tags --dirty=+)
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Lint source code
      run: |
        meson setup --cross-file "./build-mingw-win64.txt" -Denable_tests=True build/lint
        ninja clang-format-check -C build/lint

    - name: Build and run tests
      run: |
        export PATH="$PATH:$RUNNER_TEMP/llvm-mingw/bin"
        ./package-release.sh "${{ env.VERSION }}" build --enable-tests --build-arm64x
        mkdir "${HOME}/tests-prefix"
        export WINEPREFIX="${HOME}/tests-prefix"
        export WINEDEBUG=-all
        wine "./build/dxvk-nvapi-${{ env.VERSION }}/x64/nvapi64-tests.exe" [@unit-tests] -o nvapi64-tests.log
        wine "./build/dxvk-nvapi-${{ env.VERSION }}/x64/nvofapi64-tests.exe" [@unit-tests] -o nvofapi64-tests.log

    - name: Print tests results
      if: success() || failure()
      run: |
        if [ -e nvapi64-tests.log ]; then cat nvapi64-tests.log; fi
        if [ -e nvofapi64-tests.log ]; then cat nvofapi64-tests.log; fi

    - name: Create tarball
      run: tar cvfz "dxvk-nvapi-${{ env.VERSION }}.tar.gz" -C "./build/dxvk-nvapi-${{ env.VERSION }}" .

    - name: Print digest
      run: sha256sum "dxvk-nvapi-${{ env.VERSION }}.tar.gz"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: "dxvk-nvapi-${{ env.VERSION }}.tar.gz"
        if-no-files-found: error
        archive: false
