name: Build with Proton SDK

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-proton:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/proton/steamrt4/sdk:latest
      options: --user 1001 # to match GHA's "runner" user: https://github.com/actions/runner/blob/3d34a3c6d6dfd7599e489b3c04fcf95a8a428434/images/Dockerfile#L52

    steps:
    - name: Prepare LLVM MinGW
      env:
        LLVM_MINGW_VERSION: 20261104
        LLVM_MINGW_DIGEST: sha256:919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
      run: |
        curl -sfLO https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz
        echo "${LLVM_MINGW_DIGEST#sha256:} llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" | sha256sum --check  
        mkdir -p "${RUNNER_TEMP}/llvm-mingw"
        tar -C "${RUNNER_TEMP}/llvm-mingw" -xf llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz --strip-components=1

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Print build version
      run: git describe --always --tags --dirty=+

    - name: Build
      run: |
        export PATH="$PATH:${RUNNER_TEMP}/llvm-mingw/bin" 
        ./package-release.sh master build --enable-tests --build-arm64x
