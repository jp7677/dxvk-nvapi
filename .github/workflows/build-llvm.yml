name: Build with LLVM against MSVCRT and Windows SDK

on:
  push:
    branches: [ master ]
    tags: [ v* ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-llvm:
    runs-on: ubuntu-latest
    container: docker.io/archlinux/archlinux:base

    steps:
    - name: Install packages
      run: pacman -Syu --needed --noconfirm clang curl git jq lld llvm meson ninja

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set git directory permissions
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Print build version
      run: git describe --always --tags --dirty=+

    - name: Prepare MSVCRT and Windows SDK
      env:
        XWIN_VERSION: 0.10.0
        XWIN_DIGEST: sha256:d870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88
      run: |
        curl -sfLO "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${XWIN_DIGEST#sha256:} xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | sha256sum --check
        mkdir -p "${RUNNER_TEMP}/xwin"
        tar -C "${RUNNER_TEMP}/xwin" -xf "xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" --strip-components=1
        "${RUNNER_TEMP}/xwin/xwin" \
          --accept-license \
          --arch x86_64,x86 \
          splat \
          --preserve-ms-arch-notation \
          --use-winsysroot-style \
          --output ./winsysroot
        ln -s ../winsysroot ./layer/winsysroot
        cd './winsysroot/Windows Kits/10'
        test -e ./Include || mv ./include ./Include
        test -e ./Lib || mv ./lib ./Lib

    - name: Build x86
      shell: bash
      run: |
        meson setup build/32 . \
          --cross-file ./build-llvm-win32.txt \
          --buildtype release \
          --prefix ~+/install \
          --bindir bin \
          --libdir lib \
          --strip
        ninja -C build/32 install

    - name: Build x64
      shell: bash
      run: |
        meson setup build/64 . \
          --cross-file ./build-llvm-win64.txt \
          --buildtype release \
          --prefix ~+/install \
          --bindir bin \
          --libdir lib \
          --strip -Denable_tests=true
        ninja -C build/64 install

    - name: Build vkreflex layer
      shell: bash
      run: |
        meson setup build/layer layer \
          --cross-file ./build-llvm-win64.txt \
          --buildtype release \
          --prefix ~+/install/bin/layer \
          --bindir '' \
          --strip \
          -Dabsolute_library_path=false \
          -Dlibrary_path_prefix=./ \
          -Dmanifest_install_dir=.
        ninja -C build/layer install
        rm -R install/bin/layer/lib

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-nvapi-llvm
        path: install/bin/*
